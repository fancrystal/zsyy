# Isolated production virtual hosts for the zsyy voucher mall.
# This file deliberately has no dependency on /opt/mskj or port 3000.
server {
    listen 80;
    listen [::]:80;
    server_name zsyy.maishikeji.com.cn adminzsyy.maishikeji.com.cn;
    root /var/www/zsyy-acme;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zsyy.maishikeji.com.cn;

    ssl_certificate /etc/letsencrypt/live/zsyy.maishikeji.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zsyy.maishikeji.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    root /opt/zsyy/current/packages/mobile-h5/dist;
    index index.html;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adminzsyy.maishikeji.com.cn;

    ssl_certificate /etc/letsencrypt/live/zsyy.maishikeji.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zsyy.maishikeji.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    root /opt/zsyy/current/packages/admin/dist;
    index index.html;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
