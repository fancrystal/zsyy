# Temporary HTTP-only virtual hosts used for ACME HTTP-01 validation.
# Install this before issuing the first certificate, then replace it with
# zsyy.production.conf after certbot has created the certificate files.
server {
    listen 80;
    listen [::]:80;
    server_name zsyy.maishikeji.com.cn adminzsyy.maishikeji.com.cn;
    root /var/www/zsyy-acme;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
